name: Validate static app

on:
  pull_request:
    paths:
      - 'assets/**/*.js'
      - 'index.html'
      - '.github/workflows/validate-static-app.yml'
  workflow_dispatch:

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
