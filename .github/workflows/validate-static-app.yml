name: Validate static app

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/validate-static-app.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check legacy JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Run event report import tests
        run: node tests/event-report-import-core.test.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static app
        run: npm run build
      - name: Verify native production build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/volunteer-leads.js
          test -f dist/assets/volunteer-leads.css
          grep -q 'data-view="leadsView"' dist/index.html
          grep -q 'assets/volunteer-leads.js?v=20260924-1' dist/index.html
          grep -q 'assets/volunteer-leads.css?v=20260924-1' dist/index.html
          ! grep -q 'vendor/webawesome/webawesome.loader.js' dist/index.html
          ! grep -q 'assets/webawesome-ui.js' dist/index.html
          ! grep -q 'assets/webawesome-controls.js' dist/index.html
          ! grep -q 'assets/webawesome-overlays.js' dist/index.html
          ! grep -q 'assets/webawesome-dialogs.js' dist/index.html
          grep -q 'assets/event-report-import-core.js?v=20260921-1' dist/index.html
          grep -q 'assets/event-report-import.js?v=20260921-1' dist/index.html
          grep -q "async function createVolunteerIdentity" assets/event-report-import.js
          grep -q "vol_event_report" assets/event-report-import.js
          ! grep -q "retained without a profile link" assets/event-report-import.js
          grep -q 'refreshPromise:null' assets/shared-db/core.js
          grep -q 'if(S.state.refreshPromise)return S.state.refreshPromise' assets/shared-db/core.js
          grep -q 'if(st.remoteRefreshPromise)return st.remoteRefreshPromise' assets/shared-db/sync.js
          grep -q 'assets/shared-db/core.js?v=20260924-1' dist/index.html
          grep -q 'assets/shared-db/sync.js?v=20260921-1' dist/index.html
          grep -q 'aria-label="About MakLom"' dist/index.html
          grep -q 'class="info-panel hidden"' dist/index.html
          grep -q "setOpen(false)" assets/info.js
