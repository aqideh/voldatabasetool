name: Validate static app

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/validate-static-app.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check legacy JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Mantine shell
        run: npm run build
      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/assets/mantine-shell.js
          test -f dist/assets/mantine.css
          test -f dist/assets/mantine-bridge.css
