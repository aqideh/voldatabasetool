name: Validate static app

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/validate-static-app.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check legacy JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static app
        run: npm run build
      - name: Verify Web Awesome build output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/webawesome-events.js
          test -f dist/assets/webawesome-events.css
          test -f dist/assets/webawesome-ui.js
          test -f dist/assets/webawesome-ui.css
          test -f dist/assets/webawesome-event-forms.js
          test -f dist/assets/webawesome-overlays.js
          test -f dist/assets/webawesome-overlays.css
          test -f dist/vendor/webawesome/webawesome.loader.js
          test -f dist/vendor/webawesome/styles/webawesome.css
          grep -q 'vendor/webawesome/webawesome.loader.js' dist/index.html
          grep -q 'assets/webawesome-event-forms.js' dist/index.html
          grep -q 'assets/webawesome-overlays.js' dist/index.html
          grep -q 'assets/webawesome-overlays.css' dist/index.html
          ! grep -qi 'mantine' dist/index.html
