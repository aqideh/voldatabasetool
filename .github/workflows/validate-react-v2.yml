name: Validate React v2

on:
  pull_request:
    paths:
      - 'react-app/**'
      - '.github/workflows/validate-react-v2.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/index.html
          grep -q 'MakLom v2' index.html
